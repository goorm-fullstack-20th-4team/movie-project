<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Netflix Clone</title>
  <style>
    body {
      margin: 0;
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      position: fixed;
      width: 100%;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      background: transparent;
      transition: 0.3s;
      z-index: 100;
    }

    header.scrolled {
      background: black;
    }

    .hero {
      height: 70vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 40px;
    }

    .hero h1 {
      font-size: 48px;
    }

    .row {
      margin: 20px;
    }

    .posters {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }

    .posters img {
      width: 150px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .posters img:hover {
      transform: scale(1.1);
    }

    /* 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #111;
      padding: 30px;
      width: 500px;
      border-radius: 10px;
      position: relative;
    }

    .modal img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    #closeBtn {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header id="navbar">NETFLIX</header>

<div class="hero" id="hero"></div>

<div class="row">
  <h2>Popular Movies</h2>
  <div class="posters" id="movieRow"></div>
</div>

<!-- 모달 -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span id="closeBtn">&times;</span>
    <img id="modal-poster" alt="movie poster"/>
    <h2 id="modal-title"></h2>
    <p id="modal-overview"></p>
    <p><strong>개봉일:</strong> <span id="modal-date"></span></p>
    <p><strong>평점:</strong> <span id="modal-rating"></span></p>
  </div>
</div>

<script>
  const API_BASE = "https://movie-project-1-a8lu.onrender.com";

  const hero = document.getElementById("hero");
  const row = document.getElementById("movieRow");
  const navbar = document.getElementById("navbar");
  const modal = document.getElementById("modal");
  const closeBtn = document.getElementById("closeBtn");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 50) navbar.classList.add("scrolled");
    else navbar.classList.remove("scrolled");
  });

  async function loadMovies() {
    try {
      const res = await fetch(`${API_BASE}/api/movies/popular`);
      const data = await res.json();
      const movies = data.results;

      if (!movies || movies.length === 0) return;

      // HERO
      const heroMovie = movies[0];
      if (heroMovie.backdrop_path) {
        hero.style.backgroundImage =
          `url(https://image.tmdb.org/t/p/original${heroMovie.backdrop_path})`;
      }
      hero.innerHTML = `<h1>${heroMovie.title}</h1>`;

      // 포스터
      movies.forEach(movie => {
        if (!movie.poster_path) return;

        const img = document.createElement("img");
        img.src = `https://image.tmdb.org/t/p/w300${movie.poster_path}`;
        img.alt = movie.title;

        img.addEventListener("click", async () => {
          try {
            const res = await fetch(
              `${API_BASE}/api/movies/${movie.id}`
            );
            const detail = await res.json();

            document.getElementById("modal-title").innerText = detail.title;
            document.getElementById("modal-overview").innerText = detail.overview;
            document.getElementById("modal-date").innerText = detail.release_date;
            document.getElementById("modal-rating").innerText = detail.vote_average;

            const posterElement = document.getElementById("modal-poster");

            if (detail.poster_path) {
              posterElement.src =
                `https://image.tmdb.org/t/p/w500${detail.poster_path}`;
              posterElement.style.display = "block";
            } else {
              posterElement.style.display = "none";
            }

            modal.classList.remove("hidden");

          } catch (err) {
            console.error("상세 정보 로딩 실패:", err);
          }
        });

        row.appendChild(img);
      });

    } catch (err) {
      console.error("영화 목록 로딩 실패:", err);
    }
  }

  // 닫기 버튼
  closeBtn.onclick = () => {
    modal.classList.add("hidden");
  };

  // 바깥 클릭 닫기
  window.onclick = (event) => {
    if (event.target === modal) {
      modal.classList.add("hidden");
    }
  };

  loadMovies();
</script>

</body>
</html>
