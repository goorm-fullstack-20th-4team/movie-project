<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Netflix Clone</title>
  <style>
    body {
      margin: 0;
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      position: fixed;
      width: 100%;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      background: transparent;
      transition: 0.3s;
      z-index: 100;
    }

    header.scrolled {
      background: black;
    }

    .hero {
      height: 70vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 40px;
    }

    .hero h1 {
      font-size: 48px;
    }

    .row {
      margin: 20px;
    }

    .row h2 {
      margin-bottom: 10px;
    }

    .posters {
      display: flex;
      overflow-x: scroll;
      gap: 10px;
    }

    .posters img {
      width: 150px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .posters img:hover {
      transform: scale(1.1);
    }

    /* 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #111;
      padding: 30px;
      width: 500px;
      border-radius: 10px;
      position: relative;
    }

    .modal img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    #closeBtn {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header id="navbar">NETFLIX</header>

<div class="hero" id="hero"></div>

<div class="row">
  <h2>Popular Movies</h2>
  <div class="posters" id="movieRow"></div>
</div>

<!-- 모달 -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span id="closeBtn">&times;</span>
    <img id="modal-poster" />
    <h2 id="modal-title"></h2>
    <p id="modal-overview"></p>
    <p><strong>개봉일:</strong> <span id="modal-date"></span></p>
    <p><strong>평점:</strong> <span id="modal-rating"></span></p>
  </div>
</div>

<script>
  const API_URL = "http://localhost:5000/api/movies/popular";

  const hero = document.getElementById("hero");
  const row = document.getElementById("movieRow");
  const navbar = document.getElementById("navbar");

  // 스크롤 시 navbar 검정색
  window.addEventListener("scroll", () => {
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });

  async function loadMovies() {
    const res = await fetch(API_URL);
    const data = await res.json();
    const movies = data.results;

    // HERO 배너
    const heroMovie = movies[0];
    hero.style.backgroundImage =
      `url(https://image.tmdb.org/t/p/original${heroMovie.backdrop_path})`;
    hero.innerHTML = `<h1>${heroMovie.title}</h1>`;

    // 포스터 리스트
    movies.forEach(movie => {
      const img = document.createElement("img");
      img.src = `https://image.tmdb.org/t/p/w300${movie.poster_path}`;

      img.addEventListener("click", async () => {
        const res = await fetch(
          `http://localhost:5000/api/movies/\${movie.id}`
        );
        const detail = await res.json();

        document.getElementById("modal-title").innerText = detail.title;
        document.getElementById("modal-overview").innerText = detail.overview;
        document.getElementById("modal-date").innerText = detail.release_date;
        document.getElementById("modal-rating").innerText = detail.vote_average;
        document.getElementById("modal-poster").src =
          `https://image.tmdb.org/t/p/w500\${detail.poster_path}`;

        document.getElementById("modal").classList.remove("hidden");
      });

      row.appendChild(img);
    });
  }

  document.getElementById("closeBtn").addEventListener("click", () => {
    document.getElementById("modal").classList.add("hidden");
  });

  loadMovies();
</script>

</body>
</html>
